<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Embed</title>
    <style>
        /* Remove default browser margins and scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000; /* Optional: prevents white flash while loading */
        }

        /* Make the iframe track the viewport exactly */
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Swap out the URL below with the website you want to embed -->
    <iframe src="https://jackeichelberger3-beep.github.io/musical-octo-doodle-html-file-viewer-v3/"></iframe>

</body>
</html>
